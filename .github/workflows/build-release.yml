name: Build & Release fpk

# 触发方式：
#   1) 推送形如 v1.2.1 的 git tag（推荐，tag 名必须与 manifest 中 version 一致，去掉 v）
#   2) 手动 workflow_dispatch（可选，用输入版本号打 Release）
#
# 本仓库规则：**打包只在 GitHub 上进行**。本地不再打包、也不在本地下载依赖包。
# 运行期依赖（wheel）由本工作流下载并打进 fpk，安装后立即可用、全程不联网，
# 且同一个 fpk 同时支持 x86_64 与 aarch64 两种架构。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（须与 manifest 中 version 一致，如 1.2.1）"
        required: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build fpk and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 依赖轮子按 cp311 拉取，离线安装验证也需要一个 3.11 解释器
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download official fnpack
        run: |
          curl -fL -o /usr/local/bin/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: Read version from manifest
        id: version
        run: |
          VER="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*//' | tr -d ' \r')"
          if [ -z "$VER" ]; then
            echo "::error::无法从 manifest 读取 version"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "manifest version -> $VER"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TV="${TAG_VERSION#v}"
          echo "tag=$TAG_VERSION (strip v -> $TV), manifest=$MANIFEST_VERSION"
          if [ "$TV" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag 版本 ($TV) 与 manifest version ($MANIFEST_VERSION) 不一致，拒绝发布"
            exit 1
          fi

      # ---- 依赖内置：把两种架构的 wheel 拉到 app/server/vendor/wheels/ ----
      # 先自检打包工具链本身（合成数据、完全离线），再动真格的。
      - name: Test packaging scripts (offline, synthetic fixtures)
        run: |
          python3 scripts/tests/test_wheel_verify.py
          python3 scripts/tests/test_vendor_wheels_offline.py

      # 同时校验「每个依赖在 x86_64 与 aarch64 上都有可用轮子」以及编译扩展的
      # ELF 架构是否与平台标签一致；缺一条腿就在这里失败，不会带病发布。
      - name: Vendor runtime wheels (x86_64 + aarch64)
        run: bash scripts/vendor-wheels.sh

      # ---- 音频指纹要用的 fpcalc（Chromaprint 官方静态版）----
      # 以前这块靠用户在 NAS 上 apt 装 libchromaprint-tools，装不上指纹模式就废；
      # 现在构建时把官方双架构可执行文件打进 app/server/vendor/bin/。
      - name: Vendor fpcalc binaries (x86_64 + aarch64)
        run: bash scripts/vendor-fpcalc.sh

      # sha256 写死在脚本里，上游资产换掉/下载被截断都会在这里失败
      - name: Verify bundled fpcalc (both arches + pinned checksum)
        run: python3 scripts/verify-fpcalc-set.py app/server/vendor/bin

      # 校验脚本自身的自检：合成文件必须能被拦住（真实目录那份也一并复核）
      - name: Test fpcalc verify script (synthetic fixtures)
        run: python3 scripts/tests/test_fpcalc_verify.py

      # 应用自身的测试会用 ffmpeg 造样本音频；镜像里不保证有，显式装上。
      - name: Install test prerequisites (ffmpeg for sample audio)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg 已存在：$(command -v ffmpeg)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            echo "已安装：$(command -v ffmpeg)"
          fi
          ffmpeg -version | head -1
          command -v ffprobe

      # 真装一遍：建 venv + --no-index 离线安装 + import。
      # 三口校验拆成三个独立步骤：失败时看步骤名就能定位（CI 日志要管理员权限，读不到）。
      - name: Verify offline install — x86_64 install & import
        run: bash scripts/verify-offline-install.sh install

      - name: Verify offline install — run app tests on bundled deps
        run: bash scripts/verify-offline-install.sh apptests

      - name: Verify offline install — aarch64 wheel set & ELF arch
        run: bash scripts/verify-offline-install.sh arm

      # 应用中心的「更新说明」来自 manifest.changelog。
      # 这段逻辑原先只存在于本地打包脚本里，而打包已全部搬到 CI，所以必须在这里注入。
      - name: Inject manifest.changelog from CHANGELOG
        run: |
          python3 scripts/inject-changelog.py manifest CHANGELOG.md "${{ steps.version.outputs.version }}"

      - name: Build fpk
        run: |
          fnpack build --directory "$PWD"
          ls -la music-meta-web.fpk

      # 只信成品：回读 fpk，确认依赖真在包里、双架构轮子齐备、字段正确
      - name: Verify fpk payload (deps bundled + both arches + manifest fields)
        run: |
          bash scripts/verify-fpk-payload.sh music-meta-web.fpk \
            "${{ steps.version.outputs.version }}" app/server/vendor/wheels

      - name: Rename fpk with app name and version
        run: |
          VER="${{ steps.version.outputs.version }}"
          mv music-meta-web.fpk "${VER}-music-meta-web.fpk"
          echo "artifact: ${VER}-music-meta-web.fpk"
          ls -la "${VER}-music-meta-web.fpk"

      - name: Prepare release body from CHANGELOG
        run: |
          VER="${{ steps.version.outputs.version }}"
          # 从 CHANGELOG.md 提取当前版本段落（## [x.y.z] - date 到下一个 ## [ 之前）
          # 用 index 字符串匹配，避免版本号被 awk 当作正则字符类
          SECTION="$(awk -v sec="## [${VER}]" '
            index($0, sec)==1 {on=1; next}
            on && index($0, "## [")==1 {exit}
            on {print}
          ' CHANGELOG.md)"
          # 提取为空会生成没有更新日志的 Release，这里直接失败以便及时发现
          if [ -z "$SECTION" ]; then
            echo "::error::CHANGELOG.md 中找不到 ## [${VER}] 段落（Release 正文会为空）"
            exit 1
          fi
          {
            echo "## music-meta-web v${VER}"
            echo ""
            echo "### 更新日志"
            echo ""
            echo "$SECTION"
          } > "$RUNNER_TEMP/body.md"
          echo "---- 生成的 Release 正文 ----"
          cat "$RUNNER_TEMP/body.md"

      # action-gh-release 在 Release 已存在时不会更新正文（只覆盖资产），
      # 导致重复推送同一 tag 时更新日志停留在首次生成的空版本。
      # 这里先删除同名 Release，让每次发布都重新生成正文与资产（tag 本身保留）。
      - name: Remove existing release for idempotent republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Release v${VER} 已存在，先删除以便重新生成正文"
            gh release delete "v${VER}" --yes
          else
            echo "无同名 Release，直接创建"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "music-meta-web v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          body_path: "${{ runner.temp }}/body.md"
          files: |
            ${{ steps.version.outputs.version }}-music-meta-web.fpk
          fail_on_unmatched_files: true
